# Builds the 3 images on every green main commit and pushes them to GHCR.
# Deploys to the test server only when the repo variable DEPLOY is 'on' (spec 08 §2c, docs/DEPLOY.md).
# Owned by the orchestrator: agent tokens can't change workflow files.
name: Deploy
run-name: Deploy ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag (commit sha) to roll back to. Empty = build the current main.'
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cssedi

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        image:
          - { name: api, file: src/GetABursary.Api/Dockerfile }
          - { name: worker, file: src/GetABursary.Worker/Dockerfile }
          - { name: web, file: src/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Skip if the Dockerfile isn't there yet
        id: present
        run: if [ -f "${{ matrix.image.file }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.present.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.present.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/getabursary-${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/getabursary-${{ matrix.image.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    needs: build
    if: >-
      always() && vars.DEPLOY == 'on' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    environment: test
    env:
      TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      SITE: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the required settings
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          ADMINS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing secret:DEPLOY_HOST"
          [ -n "$SSH_KEY" ] || missing="$missing secret:DEPLOY_SSH_KEY"
          [ -n "$DB_URL" ] || missing="$missing secret:NEON_DATABASE_URL"
          [ -n "$ADMINS" ] || missing="$missing secret:ADMIN_EMAILS"
          [ -n "$ADMIN_PASSWORD" ] || missing="$missing secret:ADMIN_PASSWORD"
          [ -n "$SITE" ] || missing="$missing variable:SITE_DOMAIN"
          if [ -n "$missing" ]; then echo "::error::Missing settings (see docs/DEPLOY.md):$missing"; exit 1; fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # shortcut: trust the server's host key on first sight unless DEPLOY_KNOWN_HOSTS pins it.
          # shortcut: the key logs in as root (bootstrap needs it). Move app steps to the deploy user before prod.
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts; fi
          printf 'Host target\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config

      - name: Prepare the server (first time, or when bootstrap.sh changes)
        run: |
          want=$(sha256sum deploy/bootstrap.sh | cut -d' ' -f1)
          have=$(ssh target "cat /opt/getabursary/.bootstrap.sha 2>/dev/null || true")
          if [ "$want" = "$have" ]; then echo "Server already prepared."; exit 0; fi
          scp deploy/bootstrap.sh target:/root/bootstrap.sh
          ssh target "bash /root/bootstrap.sh && echo $want > /opt/getabursary/.bootstrap.sha"

      - name: Write the settings file (.env) from GitHub secrets
        env:
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          ADMINS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EXTRACTION_KEY: ${{ secrets.EXTRACTION_API_KEY }}
          GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          umask 077
          # Neon gives a postgresql:// URL; Npgsql wants key=value. Always use the direct host (drop "-pooler"):
          # EF migrations need a session lock the transaction pooler can't hold, and Npgsql pools on our side.
          conn=$(python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlparse(os.environ["DB_URL"].strip())
          host = (p.hostname or "").replace("-pooler", "")
          db = (p.path or "/").lstrip("/") or "neondb"
          print(f"Host={host};Port={p.port or 5432};Database={db};Username={u.unquote(p.username or '')};"
                f"Password={u.unquote(p.password or '')};SSL Mode=Require;Maximum Pool Size=10;Timeout=30")
          PY
          )
          provider=fake; [ -n "$EXTRACTION_KEY" ] && provider=anthropic
          # Single-quoted so compose takes values literally ($ in a password stays $). A quote or newline can't be
          # written safely, so such a value stops the deploy with a clear message.
          kv() {
            case "$2" in *"'"*|*$'\n'*) echo "::error::$1 contains a single quote or a newline. Change that secret."; exit 1;; esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            kv ASPNETCORE_ENVIRONMENT Production
            kv SITE_DOMAIN "$SITE"
            kv App__PublicBaseUrl "https://$SITE"
            kv ConnectionStrings__Default "$conn"
            kv Admin__Emails "$ADMINS"
            kv Admin__InitialPassword "$ADMIN_PASSWORD"
            kv Extraction__Provider "$provider"
            kv Extraction__Model claude-haiku-5-5
            kv Extraction__ApiKey "$EXTRACTION_KEY"
            kv Auth__Google__ClientId "$GOOGLE_ID"
            kv Auth__Google__ClientSecret "$GOOGLE_SECRET"
            kv Email__Smtp__Host "$SMTP_HOST"
            kv Email__Smtp__Port 587
            kv Email__Smtp__User "$SMTP_USER"
            kv Email__Smtp__Password "$SMTP_PASSWORD"
            kv Email__Smtp__From "$SMTP_FROM"
          } > env.generated
          scp env.generated target:/opt/getabursary/env.generated
          rm -f env.generated
          # The IP-hash salt is made once on the server and kept, so it never changes and never leaves the server.
          ssh target 'set -e; cd /opt/getabursary
            [ -s salt ] || (umask 077; openssl rand -hex 32 > salt)
            { cat env.generated; echo "Reports__IpHashSalt='"'"'$(cat salt)'"'"'"; } > .env
            rm -f env.generated; chmod 600 .env salt'

      - name: Copy compose file and Caddyfile
        run: scp deploy/docker-compose.prod.yml deploy/Caddyfile target:/opt/getabursary/

      - name: Pull, migrate, start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job's short-lived token lets the server pull the images, so they can stay private.
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh target "set -e
            trap 'docker logout ghcr.io >/dev/null' EXIT
            cd /opt/getabursary
            export IMAGE_TAG='${TAG}'
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter 'until=72h'"

      - name: Smoke check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "https://$SITE/api/v1/health"; then echo; echo "Healthy: https://$SITE"; exit 0; fi
            sleep 5
          done
          echo "::error::https://$SITE/api/v1/health didn't answer within 2 minutes. On the server: docker compose -f /opt/getabursary/docker-compose.prod.yml logs api"
          exit 1

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
