# Implementer agent: runs when a collaborator adds the `agent:ready` label to a task issue,
# or when a collaborator mentions @claude in an issue/PR comment.
# Only collaborators with triage+ access can add labels, and the action refuses @claude
# triggers from users without write access, so strangers cannot spend API credit.
name: Claude implementer

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  implement:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    # Job-level (not workflow-level) so skipped label events never cancel a real agent run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        continue-on-error: true   # global.json does not exist until T-001 is merged

      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('global.json') == '' }}
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: 'agent:ready'
          # automerge.yml posts '@claude <!-- autofix -->' fix requests as the github-actions bot.
          allowed_bots: 'github-actions'
          branch_prefix: 'task/'
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'model:haiku') && 'claude-haiku-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(docker:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue comment:*),Bash(ls:*),Bash(mkdir:*),Bash(curl:*),WebFetch,WebSearch"
            --append-system-prompt "You are an implementer agent. Follow AGENTS.md exactly. Implement ONLY the task described in this issue, inside its Scope. Run dotnet build and dotnet test before finishing. Set status: done in the task file. Open a pull request with gh pr create whose body starts with 'Lesdee,' and contains 'Closes #<issue number>', the ticked acceptance criteria and the verification commands you ran. If blocked, comment 'BLOCKED: <reason>' on the issue and stop."
