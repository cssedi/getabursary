# Builds the 3 images on every green main commit and pushes them to GHCR.
# Deploys to the test server only when the repo variable DEPLOY is 'on' (spec 08 §2c, docs/DEPLOY.md).
# Owned by the orchestrator: agent tokens can't change workflow files.
name: Deploy
run-name: Deploy ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag (commit sha) to roll back to. Empty = build the current main.'
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cssedi

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        image:
          - { name: api, file: src/GetABursary.Api/Dockerfile }
          - { name: worker, file: src/GetABursary.Worker/Dockerfile }
          - { name: web, file: src/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Skip if the Dockerfile isn't there yet
        id: present
        run: if [ -f "${{ matrix.image.file }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.present.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.present.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.present.outputs.ok == 'true'
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/getabursary-${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/getabursary-${{ matrix.image.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    needs: build
    if: >-
      always() && vars.DEPLOY == 'on' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    environment: test
    env:
      TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip until the deploy files exist
        id: present
        run: if [ -f deploy/docker-compose.prod.yml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up SSH
        if: steps.present.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Copy compose file and Caddyfile
        if: steps.present.outputs.ok == 'true'
        run: scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/Caddyfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/getabursary/"
      - name: Pull, migrate, start
        if: steps.present.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "set -e
            cd /opt/getabursary
            export IMAGE_TAG='${TAG}'
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter 'until=72h'"
      - name: Smoke check
        if: steps.present.outputs.ok == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ vars.SITE_DOMAIN }}/api/v1/health"; then echo; echo "Healthy."; exit 0; fi
            sleep 5
          done
          echo "Health check failed after 60 s."; exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
