# Reviewer agent: a separate run that reviews each PR against its task and the conventions.
# It comments only; the product owner merges.
name: Claude reviewer

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; only review branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses the Pro/Max plan when CLAUDE_CODE_OAUTH_TOKEN is set (from `claude setup-token`); otherwise API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          use_sticky_comment: true
          # Implementer PRs are opened by the Claude bot; allow reviewing them (the reviewer only comments).
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer agent for GetABursary. You did not write this code. Review like the senior developer
            who gets paged when it breaks. Order of importance: correct, safe, holds under load, tested, fast, lean.

            1. Understand first: read AGENTS.md, specs/03-conventions.md, the task file (tasks/T-xxx-*.md via the linked issue)
               and the specs it lists. Read the diff, then the code it touches: callers of every changed function, what it calls,
               the tests. If a signature/return value/behaviour changes, grep every caller. Expected load: a public website with
               many concurrent anonymous users plus one background worker; judge scale against that.
            2. Look for: Bug (wrong result, crash, edge cases: empty, zero, last item, rounding, time zones/SAST, broken caller);
               Risk (injection, secrets, missing input validation, swallowed errors, writes without a transaction);
               Scale (check-then-write races, query per item/N+1, unbounded lists or memory, per-process state that must be shared);
               Missing test (risky new logic with no test that fails when it breaks; one good test, not coverage);
               Speed (big slowdowns); Lean (dead code, unused options, speculative features, an existing repo helper not reused
               (name the path), stdlib/platform already does it, a new dependency for a few lines, abstraction with one
               implementation beyond what the layering rules require, near-copies, a function mixing unrelated jobs).
               Also: acceptance criteria met; files inside Scope (the AGENTS.md "Standing scope allowance" and scope approved in
               comments by @cssedi or an "orchestrator note" count as in Scope); layering + Result<T>; no secrets; migrations rules.
               For changes under src/web/: check specs/06-design.md (§3 tokens, §4 type, §5 layout, §6 principles, §7 checklist,
               §8 copy); §7 anti-patterns and off-token colours are Must fix. Open (Read) every PNG the PR adds under
               docs/screenshots/<task>/: overlapping or clipped elements, horizontal scroll or missing screenshots are Must fix.
            3. Check before reporting: every finding needs a concrete case ("this input/situation gives this wrong result").
               Re-read the lines to confirm. A `// shortcut:` comment that names its limit is a decision, not a finding, unless
               the expected load already crosses it. Propose the smallest fix; prefer fixes that delete code. No style taste,
               no "consider", no vague worries.
            4. You MUST post ONE summary comment on the PR by running `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
               (inline comments for specific lines are optional extras). Write it in very simple English, short sentences:
               - Start with "Lesdee," then "What this change does:" in two or three sentences.
               - Findings in groups **Must fix** / **Should fix** / **Nice to have** (skip empty groups), numbered across groups.
                 Each finding: a bold title with `path:Lx-Ly`, then "What this is:", "Problem:", "Fix:", "If we skip it:"
                 (one or two short sentences each).
               - End with "Verdict: Ship." or "Verdict: fix N and M first.", then "Lean: -<N> lines possible." if lean findings
                 exist, then "Not checked:" (one line) if something mattered and you couldn't check it.
               - Final line, exactly one of (the auto-merge workflow reads it):
                 `VERDICT: CHANGES REQUESTED` if there is any Must fix, or any Should fix of type "missing test" or "Risk";
                 `VERDICT: NEEDS HUMAN` only for decisions an agent can't make (product/spec choices, data a person must check);
                 otherwise `VERDICT: APPROVE`.
            You list findings; you change no code. The task is not finished until the `gh pr comment` has been posted.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      # Notify the product owner: request their review once the AI review is in (whatever the verdict).
      - name: Request human review (only when auto-merge is off; automerge.yml handles it otherwise)
        if: always() && vars.AUTOMERGE != 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --add-reviewer "${{ github.repository_owner }}" \
            || echo "Could not request review (already requested or owner is the author)."
