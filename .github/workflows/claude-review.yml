# Reviewer agent: a separate run that reviews each PR against its task and the conventions.
# It comments only; the product owner merges.
name: Claude reviewer

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; only review branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          # Implementer PRs are opened by the Claude bot; allow reviewing them (the reviewer only comments).
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer agent for GetABursary. You did not write this code.
            1. Read AGENTS.md and specs/03-conventions.md.
            2. Find the task file referenced by this PR (tasks/T-xxx-*.md, via the linked issue) and read the specs it lists.
            3. Review the diff. Check: every acceptance criterion is actually met; files changed are inside the task Scope;
               layering (Controller → Service → Repository, Result<T>); required tests exist and are meaningful;
               no secrets; no unjustified dependencies; migrations follow the rules; PR description starts with 'Lesdee,'.
            4. Post ONE summary comment starting with 'Lesdee,' and a verdict line: `VERDICT: APPROVE`, `VERDICT: CHANGES REQUESTED`
               or `VERDICT: NEEDS HUMAN`. List blocking issues first, then optional suggestions. Use inline comments for specific lines.
            The "Standing scope allowance" in AGENTS.md (test infrastructure; existing tests updated for the intended change) is in Scope when listed in the PR.
            Scope changes approved in a PR/issue comment by the repo owner (@cssedi) or in an "orchestrator note" comment count as in Scope.
            Use NEEDS HUMAN only for decisions an agent can't make (product/spec choices, data that must be checked by a person, security).
            Always end with exactly one VERDICT line.
            Be strict about scope creep and missing tests. Be brief.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      # Notify the product owner: request their review once the AI review is in (whatever the verdict).
      - name: Request human review (only when auto-merge is off; automerge.yml handles it otherwise)
        if: always() && vars.AUTOMERGE != 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --add-reviewer "${{ github.repository_owner }}" \
            || echo "Could not request review (already requested or owner is the author)."
