# Implementer run for one task. Dispatched by autopilot.yml (or by hand from the Actions tab).
# Uses workflow_dispatch because claude-code-action does not support push-triggered runs.
name: Implement task
run-name: Implement ${{ inputs.task_id }} (#${{ inputs.issue }})

on:
  workflow_dispatch:
    inputs:
      issue:
        type: number
        required: true
      task_id:
        type: string
        required: true
      task_file:
        type: string
        required: true
      model:
        type: choice
        options: [haiku, sonnet]
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ inputs.issue }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark in progress
        run: gh issue edit ${{ inputs.issue }} -R "$GITHUB_REPOSITORY" --add-label agent:in-progress

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('global.json') != '' }}
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF tools (for tasks that read source PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses the Pro/Max plan when CLAUDE_CODE_OAUTH_TOKEN is set (from `claude setup-token`); otherwise API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # Runs are dispatched by autopilot.yml using GITHUB_TOKEN, i.e. the github-actions bot.
          allowed_bots: 'github-actions'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ inputs.issue }}
            TASK: ${{ inputs.task_id }} (tasks/${{ inputs.task_file }})

            You are an implementer agent for GetABursary.
            1. Read AGENTS.md, then the task file tasks/${{ inputs.task_file }} and every spec section it lists.
               (`gh issue view ${{ inputs.issue }}` shows the same task plus any discussion.)
            2. Create the branch `task/${{ inputs.task_id }}` from main.
            3. Implement ONLY this task, inside its Scope, with the tests it requires.
            4. Run `dotnet build` and `dotnet test` (and any "How to verify" commands) until they pass.
            5. Set `status: done` in the task file's front-matter. Commit (Conventional Commits, mention ${{ inputs.task_id }}).
               Right before pushing, run `git fetch origin main && git rebase origin/main` (main may have moved; a stale base gets the push rejected), re-run the build/tests if the rebase changed anything, then push.
            6. Open ONE pull request with `gh pr create --base main`. The body must start with "Lesdee," and contain
               "Closes #${{ inputs.issue }}", the ticked acceptance criteria, and the verification commands you ran with results.
            If you are blocked (unclear spec, files outside Scope needed, approach doesn't work): do NOT guess.
            Run `gh issue comment ${{ inputs.issue }} --body "Lesdee, BLOCKED: <reason> ..."` with your question and options, then stop.
            If you end WITHOUT opening a PR for any reason (blocked site, failing build, unclear spec), you MUST first post
            `gh issue comment ${{ inputs.issue }} --body "Lesdee, BLOCKED: <what you tried, the exact error, and options>"`. Never stop silently.
            Before posting BLOCKED, commit what you have and push it to the task branch (WIP is fine), so the next run can continue from it instead of starting over.
          claude_args: |
            --model ${{ inputs.model == 'haiku' && 'claude-haiku-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 90
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(dotnet:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(docker:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(ls:*),Bash(mkdir:*),Bash(curl:*),WebFetch,WebSearch"

      - name: Clear in-progress label if a PR was opened
        if: success()
        run: |
          if gh pr list -R "$GITHUB_REPOSITORY" --state open --head "task/${{ inputs.task_id }}" --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "PR opened; keeping agent:in-progress until it merges."
          else
            gh issue edit ${{ inputs.issue }} -R "$GITHUB_REPOSITORY" --remove-label agent:in-progress --add-label agent:blocked
            gh issue comment ${{ inputs.issue }} -R "$GITHUB_REPOSITORY" --body "Lesdee, the autopilot run finished without opening a PR. Marked \`agent:blocked\`. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Mark blocked on failure
        if: failure() || cancelled()
        run: |
          gh issue edit ${{ inputs.issue }} -R "$GITHUB_REPOSITORY" --remove-label agent:in-progress --add-label agent:blocked
          gh issue comment ${{ inputs.issue }} -R "$GITHUB_REPOSITORY" --body "Lesdee, the autopilot run failed. Marked \`agent:blocked\`. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
